# Gateway Deployment + Service for the local kind cluster. Points at the
# Strimzi-managed Kafka bootstrap service in the `kafka` namespace.
# Apply after deploy/k8s/kafka.yaml is Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cozy-critter
spec:
  replicas: 1 # single instance for now — see IMPLEMENTATION_PLAN.md
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: cozy-critter-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: cozy-critter-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: ALLOWED_ORIGINS
              value: localhost:8081
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cozy-critter
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
