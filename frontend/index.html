<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cozy Critter Puzzle Parlor</title>
  <style>
    body { font-family: sans-serif; background: #1c1c26; color: #eee; }
    #lobby { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
    #play-area { display: flex; gap: 1.5rem; align-items: flex-start; }
    #room { display: none; }
    #status { font-size: 0.9rem; color: #aaa; }
    #balance { font-size: 0.9rem; color: #e8a33d; }
    #chat { max-width: 480px; margin-top: 0.5rem; }
    #chat-log { height: 120px; overflow-y: auto; background: #14141c; padding: 0.4rem; font-size: 0.85rem; }
    #chat-log p { margin: 0 0 0.2rem 0; }
    #chat-log p.rejected { color: #d98a8a; font-style: italic; }
    #chat-input { width: 360px; }

    #wordgame { display: none; }
    #word-grid { display: flex; flex-direction: column; gap: 4px; margin-bottom: 0.75rem; }
    .word-row { display: flex; gap: 4px; }
    .tile {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; font-weight: bold; text-transform: uppercase;
      background: #14141c; border: 1px solid #44445a;
    }
    .tile.correct { background: #4a7a4a; border-color: #4a7a4a; }
    .tile.present { background: #b8a23a; border-color: #b8a23a; }
    .tile.absent { background: #33333f; border-color: #33333f; }

    #keyboard { display: flex; flex-direction: column; gap: 4px; }
    .kb-row { display: flex; gap: 4px; }
    .kb-key {
      min-width: 28px; padding: 6px 4px; font-size: 0.8rem; text-transform: uppercase;
      background: #33333f; color: #eee; border: none; cursor: pointer;
    }
    .kb-key.wide { min-width: 48px; }
    .kb-key.correct { background: #4a7a4a; }
    .kb-key.present { background: #b8a23a; }
    .kb-key.absent { background: #222229; color: #777; }

    #wordgame-status { margin-top: 0.5rem; font-size: 0.9rem; }

    #connections { display: none; max-width: 320px; }
    #conn-solved { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
    .conn-solved-row {
      padding: 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold;
      text-align: center; color: #14141c;
    }
    .conn-solved-row .conn-solved-name { display: block; text-transform: uppercase; }
    .conn-solved-row .conn-solved-members { font-weight: normal; text-transform: uppercase; }
    .conn-level-0 { background: #e8d84a; }
    .conn-level-1 { background: #6fbf6f; }
    .conn-level-2 { background: #7fa8e0; }
    .conn-level-3 { background: #b98fd6; }
    .conn-level--1 { background: #999999; }

    #conn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 0.75rem; }
    .conn-tile {
      padding: 0.6rem 0.2rem; font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
      background: #14141c; color: #eee; border: 1px solid #44445a; cursor: pointer;
      text-align: center;
    }
    .conn-tile.selected { background: #44445a; border-color: #8888a8; }
    .conn-tile.shake { animation: conn-shake 0.3s; border-color: #d98a8a; }
    @keyframes conn-shake {
      25% { transform: translateX(-4px); } 75% { transform: translateX(4px); }
    }

    #conn-mistakes { font-size: 0.85rem; margin-bottom: 0.5rem; }
    .conn-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #44445a; margin-right: 4px; }
    .conn-dot.used { background: #d98a8a; }

    #connections-status { margin-top: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="lobby">
    <input id="display-name-input" placeholder="your name" maxlength="16" />
    <button id="create-room">Create Room</button>
    <input id="room-code-input" placeholder="room code" maxlength="6" />
    <button id="join-room">Join Room</button>
    <button id="play-word-game">Play Word Game</button>
    <button id="play-connections">Play Connections</button>
  </div>
  <p id="status"></p>
  <p id="balance">Critter Coins: <span id="balance-amount">0</span></p>
  <div id="play-area">
    <div id="room">
      <div id="game"></div>
      <div id="chat">
        <div id="chat-log"></div>
        <input id="chat-input" placeholder="say something..." maxlength="200" />
        <button id="chat-send">Send</button>
      </div>
    </div>
    <div id="wordgame">
      <div id="word-grid"></div>
      <div id="keyboard"></div>
      <p id="wordgame-status"></p>
      <button id="new-game">New Game</button>
    </div>
    <div id="connections">
      <div id="conn-solved"></div>
      <div id="conn-grid"></div>
      <div id="conn-mistakes"></div>
      <button id="conn-submit" disabled>Submit Group</button>
      <p id="connections-status"></p>
      <button id="new-connections">New Puzzle</button>
    </div>
  </div>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
